name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  unit:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      # Same two steps CONTRIBUTING.md tells a contributor to run, so CI is
      # actually exercising the documented setup rather than a PYTHONPATH
      # shortcut that only works here.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e helper --no-deps
      - name: Run unit tests (skip integration)
        working-directory: helper
        run: pytest -q -m "not integration"

  integration:
    name: Integration tests (slow)
    needs: unit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e helper --no-deps
      - name: Run integration tests
        working-directory: helper
        run: pytest -q -m integration
